# ---------------------------------------------------------------------------
# Glamoraa default configuration (safe to commit - contains NO real secrets).
#
# Override ANY key, in this order of priority (highest first):
#   1. Environment variable: key upper-cased, dots -> underscores, prefix GLAMORAA_
#        e.g. db.password  ->  GLAMORAA_DB_PASSWORD
#   2. src/main/resources/glamoraa-local.properties   (git-ignored; copy the .example file)
#   3. This file.
# ---------------------------------------------------------------------------

# ---- Database --------------------------------------------------------------
db.driver=com.mysql.cj.jdbc.Driver
db.url=
db.user=
db.password=

# ---- Storefront ------------------------------------------------------------
site.name=Glamoraa
site.tagline=Discover Your Signature Style.
# Shown in the announcement bar. Leave empty to hide the bar.
# {freeShipping} is replaced by shipping.free_threshold, which IS enforced at checkout.
site.announcement=Complimentary shipping on orders above {freeShipping}
shipping.free_threshold=2999
shipping.flat_fee=99
catalog.page_size=12
cart.max_quantity_per_item=10
low_stock.threshold=5

# ---- Optional links (leave empty to hide) -----------------------------------
social.instagram=
social.facebook=
social.pinterest=
contact.email=

# ---- Admin bootstrap -------------------------------------------------------
# If NO admin account exists at startup and BOTH email and password are set, one is created.
# Set these in glamoraa-local.properties or environment variables - never commit a real password.
admin.bootstrap.name=Glamoraa Admin
admin.bootstrap.email=
admin.bootstrap.password=

# ---- Uploads ---------------------------------------------------------------
# Folder for admin-uploaded product images (served at /media/...). It lives OUTSIDE the WAR so
# redeploys never delete it. Empty = <your home folder>/glamoraa-uploads
upload.dir=
upload.max_bytes=3145728
